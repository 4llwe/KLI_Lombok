<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konfirmasi Pembayaran — KLI</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"></head><body class="auth-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="portal.html"><img class="brand-logo" src="assets/kli-logo-web.png" alt="KLI"><span>KLI <small>Pembayaran aman</small></span></a><a class="button button-secondary" href="portal.html">Kembali ke portal</a></div></header><main class="section"><div class="container form-grid"><div><p class="eyebrow">Transfer bank manual</p><h1>Konfirmasi pembayaran</h1><div id="invoice-summary" class="portal-panel"><p>Memuat invoice…</p></div><div id="bank-details" class="security-note"></div></div><form id="payment-form"><label>Nama pengirim<input name="senderName" required></label><label>Bank pengirim<input name="bankName" required></label><label>Tanggal transfer<input type="date" name="transferDate" required></label><label>Jumlah transfer<input type="number" name="amount" min="1" required></label><label>Bukti transfer<input type="file" name="proof" accept="image/jpeg,image/png,application/pdf" required><small>Maksimal 5 MB; JPG, PNG, atau PDF.</small></label><label class="consent"><input type="checkbox" required> Saya menyatakan data transfer benar.</label><button class="button button-lg" type="submit">Kirim konfirmasi</button><p id="payment-status" role="status"></p></form></div></main><script type="module" src="payment.js"></script></body></html>
