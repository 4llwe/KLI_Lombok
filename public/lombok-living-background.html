<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lombok Living Background</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
    }
    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: -6%;
      background: url("Lombok_WebBackground_HD.jpg") center / cover no-repeat;
      transform-origin: 62% 38%;
      animation: kenburns 32s ease-in-out infinite alternate;
      will-change: transform;
    }
    .sun {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 42% 28% at 86% 10%, rgba(255, 214, 140, 0.22), transparent 70%),
        radial-gradient(ellipse 50% 40% at 70% 80%, rgba(20, 120, 140, 0.10), transparent 70%);
      pointer-events: none;
      animation: glow 10s ease-in-out infinite alternate;
    }
    .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 36%,
        rgba(255, 255, 255, 0.07) 48%,
        rgba(255, 236, 190, 0.08) 50%,
        rgba(255, 255, 255, 0.05) 52%,
        transparent 64%
      );
      mix-blend-mode: screen;
      animation: shimmer 14s ease-in-out infinite;
      pointer-events: none;
    }
    .haze {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(6, 18, 24, 0.18), transparent 38%),
        linear-gradient(to right, rgba(8, 24, 18, 0.08), transparent 30%);
      pointer-events: none;
    }
    @keyframes kenburns {
      from { transform: scale(1) translate(0, 0); }
      to { transform: scale(1.09) translate(-1.8%, -1.2%); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-18%); opacity: 0.25; }
      50% { transform: translateX(12%); opacity: 0.55; }
      100% { transform: translateX(22%); opacity: 0.2; }
    }
    @keyframes glow {
      from { opacity: 0.75; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg, .shimmer, .sun { animation: none; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-label="Latar pantai dan pegunungan Lombok">
    <div class="bg"></div>
    <div class="sun"></div>
    <div class="shimmer"></div>
    <div class="haze"></div>
  </div>
</body>
</html>
